[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "movie-workers"
version = "0.1.0"
description = "Python workers for ranking engine and API enrichment"
authors = ["Movie Team"]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.26.0"
scipy = "^1.11.0"
pydantic = "^2.5.0"
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.0"
redis = "^5.0.1"
openai = "^1.6.0"
python-dotenv = "^1.0.0"

[tool.poetry.scripts]
train-profile = "src.training:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.12.0"
isort = "^5.13.0"
ruff = "^0.1.0"

[tool.pytest.ini_options]
# So `import src...` resolves regardless of how/where pytest is invoked from.
pythonpath = ["."]
testpaths = ["tests"]
