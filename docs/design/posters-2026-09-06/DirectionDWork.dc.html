<script data-dc-script data-props='{"dwell": {"editor": "int", "default": 5, "min": 2, "max": 10, "unit": "s", "section": "الدوران"}, "loop": {"editor": "boolean", "default": true, "section": "الدوران"}, "scrolling": {"editor": "boolean", "default": false, "section": "محاكاة"}, "reducedMotion": {"editor": "boolean", "default": false, "section": "محاكاة"}, "$preview": {"width": 390, "height": 880}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.elapsed = 0;
    this.timer = setInterval(() => {
      const p = this.props || {};
      const reduced = !!p.reducedMotion || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  renderVals() {
    const p = this.props || {};
    const dwell = Math.max(2, Math.min(10, Number(p.dwell) || 5)) * 1000;
    const stagger = 1200;
    const reduced = !!p.reducedMotion || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const elapsed = reduced ? 0 : (this.elapsed || 0);
    const counts = [4];
    const prefixes = ["a"];
    const vals = {};

    counts.forEach((n, i) => {
      let idx = 0;
      if (n > 1) {
        const start = dwell + i * stagger;
        const flips = elapsed < start ? 0 : 1 + Math.floor((elapsed - start) / dwell);
        if (p.loop !== false) idx = flips % n;
        else if (flips >= n) { idx = 0; resting += 1; }
        else idx = flips % n;

      for (let j = 0; j < 4; j += 1) vals[prefixes[i] + (j + 1)] = j === idx ? 1 : 0;

      : 'الثانية ' + s + ' · كل بطاقة تبدّل كل ' + (dwell / 1000) + ' ث، بتفاوت 1.2 ث بينها' + (resting ? ' · ' + resting + ' استراحت بعد جولة كاملة' : ''));
    return vals;
  }
}
