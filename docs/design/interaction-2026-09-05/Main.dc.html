<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; background: #06070f; color: #eef0ff; font-family: 'IBM Plex Sans Arabic','Segoe UI',sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: #8b7cff; } a:hover { color: #a99dff; }
    .disp { font-family: 'Readex Pro','IBM Plex Sans Arabic',sans-serif; line-height: 1.3; }
    .num { font-variant-numeric: tabular-nums; }
    .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: #9aa0c8; }
    .tab.on { color: #8b7cff; }
    .poster { position: relative; width: 76px; height: 114px; border-radius: 8px; flex: none; overflow: hidden; }
    .ini { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Readex Pro',sans-serif; font-weight: 700; font-size: 34px; color: rgba(255,255,255,0.16); }
    .card { display: flex; align-items: center; gap: 12px; padding: 10px; background: #10132a; border: 1px solid #232853; border-radius: 8px; }
    .grip { width: 44px; height: 44px; flex: none; display: grid; place-items: center; color: #9aa0c8; }
    .step { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid #232853; border-radius: 8px; color: #eef0ff; }
    .rank { width: 30px; height: 30px; flex: none; border-radius: 15px; display: grid; place-items: center; font-family: 'Readex Pro',sans-serif; font-weight: 700; font-size: 15px; background: #8b7cff; color: #12093d; }
    .ttl { font-size: 14px; font-weight: 500; line-height: 1.4; }
    .yr { font-size: 12px; color: #9aa0c8; direction: ltr; text-align: right; }
    .lbl { font-size: 12px; color: #9aa0c8; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #06070f; direction: rtl;">

  <div style="position: absolute; inset-inline: 0; top: 0; height: 4px; background: #8b7cff;"></div>

  <header style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 0 6px; border-bottom: 1px solid #232853;">
    <div style="width: 44px; height: 44px; display: grid; place-items: center; color: #eef0ff;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; direction: ltr;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#8b7cff"><rect x="2" y="6" width="6" height="12" rx="1.5"></rect><rect x="9" y="3" width="6" height="18" rx="1.5"></rect><rect x="16" y="6" width="6" height="12" rx="1.5"></rect></svg>
      <span class="disp" style="font-size: 19px; font-weight: 600;">Kolme</span>
    </div>
    <div style="width: 44px; height: 44px;"></div>
  </header>

  <main style="display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 0 16px;">

    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div>
        <div style="font-size: 12px; color: #8b7cff; font-weight: 500;">اتجاه أ · العمود</div>
        <h2 class="disp" style="margin: 2px 0 0 0; font-size: 24px; font-weight: 600;">رتّبها من الأعلى إلى الأسفل</h2>
      </div>
      <div style="display: flex; gap: 4px; direction: ltr;">
        <i style="width: 22px; height: 4px; border-radius: 2px; background: #8b7cff;"></i>
        <i style="width: 22px; height: 4px; border-radius: 2px; background: #8b7cff;"></i>
        <i style="width: 22px; height: 4px; border-radius: 2px; background: #8b7cff;"></i>
        <i style="width: 22px; height: 4px; border-radius: 2px; background: #232853;"></i>
        <i style="width: 22px; height: 4px; border-radius: 2px; background: #232853;"></i>
      </div>
    </div>

    <p style="margin: 0; font-size: 13px; color: #9aa0c8;">اسحب بالمقبض، أو استخدم السهمين. لا نجوم ولا إعجاب.</p>

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 2px;">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #8b7cff;"></span>
      <span class="lbl">الأكثر إعجابًا</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="card">
        <span class="grip"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="9" cy="19" r="1.8"/><circle cx="15" cy="5" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="15" cy="19" r="1.8"/></svg></span>
        <span class="rank">1</span>
        <div class="poster" style="background: linear-gradient(160deg,#b0532e,#171b38);"><span class="ini">R</span></div>
        <div style="flex: 1; min-width: 0;">
          <div class="ttl">آر آر آر</div>
          <div class="yr num">RRR · 2022</div>
        </div>
        <div style="display: grid; gap: 4px;">
          <span class="step" style="opacity: .35;">↑</span>
          <span class="step">↓</span>
        </div>
      </div>

      <div class="card" style="border-color: #8b7cff; box-shadow: 0 10px 24px rgba(0,0,0,.45); transform: translateY(-2px);">
        <span class="grip" style="color: #8b7cff;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="9" cy="19" r="1.8"/><circle cx="15" cy="5" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="15" cy="19" r="1.8"/></svg></span>
        <span class="rank">2</span>
        <div class="poster" style="background: linear-gradient(160deg,#d08a3a,#171b38);"><span class="ini">C</span></div>
        <div style="flex: 1; min-width: 0;">
          <div class="ttl">كوكو</div>
          <div class="yr num">Coco · 2017</div>
        </div>
        <div style="display: grid; gap: 4px;">
          <span class="step">↑</span>
          <span class="step">↓</span>
        </div>
      </div>

      <div class="card">
        <span class="grip"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="5" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="9" cy="19" r="1.8"/><circle cx="15" cy="5" r="1.8"/><circle cx="15" cy="12" r="1.8"/><circle cx="15" cy="19" r="1.8"/></svg></span>
        <span class="rank">3</span>
        <div class="poster" style="background: linear-gradient(160deg,#c94f8a,#171b38);"><span class="ini">B</span></div>
        <div style="flex: 1; min-width: 0;">
          <div class="ttl">باربي</div>
          <div class="yr num">Barbie · 2023</div>
        </div>
        <div style="display: grid; gap: 4px;">
          <span class="step">↑</span>
          <span class="step" style="opacity: .35;">↓</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 2px;">
      <span style="width: 8px; height: 8px; border-radius: 4px; border: 1px solid #232853;"></span>
      <span class="lbl">الأقل إعجابًا</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 2px;">
      <span class="lbl">لم أشاهد أحدها · لا أتذكر أحدها</span>
      <span style="font-size: 12px; color: #8b7cff;">استبدل</span>
    </div>
  </main>

  <div style="position: absolute; inset-inline: 0; bottom: 61px; padding: 10px 16px 14px 16px; background: linear-gradient(180deg, rgba(6,7,15,0) 0%, #06070f 40%);">
    <div style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #8b7cff; color: #12093d; font-weight: 600; font-size: 16px;">حفظ الترتيب</div>
  </div>

  <nav style="position: absolute; bottom: 0; inset-inline: 0; height: 61px; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid #232853; background: #06070f;">
    <div class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg><span>الرئيسية</span></div>
    <div class="tab on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span>رتّب</span></div>
    <div class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M15 9l-2 5-4 1 2-5z"/></svg><span>اكتشف</span></div>
    <div class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg><span>قائمتي</span></div>
    <div class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0114 0"/></svg><span>ملفي</span></div>
  </nav>
</div>
</x-dc>
</body>
</html>
