# Project name is pinned so every invocation (root `docker:up`/`docker:down`,
# `apps/backend` `test:e2e:up`, the Makefile) lands in ONE compose project,
# whatever directory it is run from. Without it compose derives the name from
# `--project-directory` (repo root -> `movie`) or, before ADR-38, from this
# file's directory (-> `docker`), which split the stack across two projects in
# Docker Desktop and left `docker:down` / `make db-reset` unable to reach the
# dev database. Volumes and network are prefixed with this name
# (`movie_postgres_data`, `movie_redis_data`, `movie_movie-network`).
#
# One-time recreate for containers created before this line existed (they show
# under a `docker` group in Docker Desktop; data lives in `docker_postgres_data`
# / `docker_redis_data`): stop and remove the old containers, `up --no-start`
# to create the new empty volumes, copy each old volume into its new one with
# `docker run --rm -v docker_X:/from:ro -v movie_X:/to alpine cp -a /from/. /to/`,
# then `npm run docker:up`. Done 2026-09-03; old volumes kept as a backup.
name: movie

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: movie-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movieapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-moviedb}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # First-init-only: creates `moviedb_test` alongside `moviedb` in this
      # same instance (board C-17). A volume from before C-17 needs the
      # one-time manual step documented in init-test-db.sql's header instead.
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    networks:
      - movie-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movieapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: movie-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - movie-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  movie-network:
    driver: bridge
